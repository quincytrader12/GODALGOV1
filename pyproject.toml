[project]
name = "godalgov1"
version = "0.1.0"
description = "Algorithmic crypto trading bot"
requires-python = ">=3.11"

dependencies = [
  # Unified API across ~100 crypto exchanges.
  # ccxt.async_support and ccxt.pro (WebSocket streaming) ship in the base
  # package as of v4 -- no extras required.
  "ccxt==4.5.76",

  # Numerics. pandas for bar/series handling, scipy for distributions used by
  # the deflated Sharpe ratio, statsmodels for ADF and OLS in the OU fits.
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scipy>=1.13",
  "statsmodels>=0.14",

  # Parquet backend for the OHLCV disk cache in godalgo.data.feed.
  "pyarrow>=15",

  # Local UI server. Binds to 127.0.0.1 only -- it holds exchange
  # credentials and must never be reachable off the machine.
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
godalgo = "godalgo.__main__:main"
godalgo-terminal = "godalgo.ui.server:main_cli"

[tool.hatch.build.targets.wheel]
packages = ["src/godalgo"]

[tool.hatch.build.targets.wheel.force-include]
"src/godalgo/ui/static" = "godalgo/ui/static"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# RUF046 flags int(round(x)) as redundant. It is not, for us: numpy scalars
# round differently across the numpy versions this project supports (1.x
# returned np.float64 from round(), 2.x returns int), and a float where an int
# is expected fails deep inside pandas as a skipped candidate rather than an
# error. The explicit cast is deliberate version insurance -- see
# ParamSpec.clip and tests/test_params.py.
ignore = ["RUF046"]
